<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Workbook · Mockup</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<script src="assets/catalog-data.js"></script>
<script src="assets/shared.js"></script>
<script>
(function () {
  var esc = RFV.esc, icon = RFV.icon, C = CATALOG, R = C.report, T = R.totals;
  var view = RFV.shell({ page: "load-workbook.html", title: "Load workbook", sub: "Parse report for " + esc(C.meta.workbook) + ", generated by the same rules the app will use" });

  var sysCell = function (t) { return t.role === "master" ? '<span class="faint">master</span>' : RFV.sysChip(t.sys, t.sub); };
  var maxRule = Math.max.apply(null, R.rules.map(function (r) { return r.count; }));

  view.innerHTML =
    '<div class="content" style="display:grid;gap:var(--sp-4)">' +
    '<div class="drop" id="drop" tabindex="0" role="button" aria-label="Drop an xlsx workbook here, or press Enter to browse">' +
      icon("upload") + '<div style="margin-top:8px"><strong>Drop an .xlsx workbook here</strong> or <a href="#" id="browse">browse…</a></div>' +
      '<div class="faint" style="font-size:var(--fs-sm);margin-top:4px">Parsed locally by the app\'s own server on 127.0.0.1. Nothing leaves this machine. (In this mockup, regenerate with <code>node scripts/build-mockup-data.mjs</code>.)</div></div>' +
    '<div class="panel" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' + icon("file") +
      '<div style="min-width:0;flex:1"><div style="font-weight:600">' + esc(C.meta.workbook) + '</div><div class="faint mono" style="font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis">' + esc(C.meta.workbookPath) + " · modified " + esc(C.meta.modified) + "</div></div>" +
      '<label class="check"><input type="checkbox" checked> Remember this path</label>' +
      '<label class="check"><input type="checkbox" checked> Watch for changes</label>' +
      '<span class="faint" style="font-size:var(--fs-sm)">Loaded ' + esc(C.meta.loadedAt) + "</span>" +
      '<button class="btn">' + icon("refresh", "i-sm") + 'Reload</button><button class="btn">Change…</button></div>' +

    '<div class="cards">' +
      '<div class="card"><div class="num">' + T.jobTabs + '</div><div class="lbl">Job tabs parsed</div><div class="hint">+1 master tab (' + T.categories + " categories, " + T.services + " services)</div></div>" +
      '<div class="card"><div class="num">' + T.skipped + '</div><div class="lbl">Tabs skipped</div><div class="hint">' + (function () { var h = R.skipped.filter(function (x) { return x.reason === "hidden"; }).length, o = R.skipped.length - h; return h + " hidden job tab" + (h === 1 ? "" : "s") + (o ? " · " + o + " other (not job data)" : ""); })() + "</div></div>" +
      '<div class="card"><div class="num">' + T.jobs + '</div><div class="lbl">Jobs</div><div class="hint">one row = one job · ' + T.fullyMatched + " fully matched</div></div>" +
      '<div class="card warn"><div class="num">' + (T.jobs - T.fullyMatched) + '</div><div class="lbl">Not fully matched</div><div class="hint">' + T.suggested + " suggested · " + T.unassigned + " Unassigned service · " + T.unmapped + " Unmapped</div></div>" +
      '<div class="card"><div class="num" style="font-size:20px;padding-top:6px"><span style="color:var(--ok)">' + T.parsed + '</span> · <span style="color:var(--warn)">' + T.assumed + '</span> · <span style="color:var(--danger)">' + T.unparseable + '</span></div><div class="lbl">Frequencies</div><div class="hint">parsed · assumed · unparseable · ' + T.unscheduled + " unscheduled</div></div>" +
    "</div>" +

    '<section><h2 style="font-size:var(--fs-lg);margin:var(--sp-2) 0">Tabs</h2><div class="table-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Tab</th><th>Role</th><th>System</th><th style="text-align:right">Rows parsed</th><th style="text-align:right">Merged ranges</th><th>Extra columns kept as attributes</th><th style="text-align:right">Warnings</th></tr></thead><tbody>' +
      R.tabs.map(function (t) {
        return "<tr><td><strong>" + esc(t.name) + "</strong></td><td>" + (t.role === "master" ? '<span class="tag tag-info">master</span>' : '<span class="tag">jobs</span>') + "</td><td>" + sysCell(t) +
          '</td><td style="text-align:right">' + t.rows + (t.role === "master" ? ' <span class="faint">services</span>' : "") + '</td><td style="text-align:right">' + (t.merges ? t.merges + ' <span class="faint">expanded</span>' : "—") + '</td><td style="white-space:normal">' + (t.extra.length ? esc(t.extra.join(", ")) : '<span class="faint">—</span>') +
          '</td><td style="text-align:right">' + (t.warnings ? '<span class="tag tag-warn">' + t.warnings + "</span>" : "—") + "</td></tr>";
      }).join("") +
      R.skipped.map(function (t) { return '<tr class="is-disabled"><td>' + esc(t.name) + '</td><td><span class="tag">skipped</span></td><td colspan="2">' + esc(t.reason) + (t.rows ? " · " + t.rows + " rows not loaded" : "") + '</td><td colspan="3"><span class="faint">enable with includeHiddenTabs / tabAllowlist in config/app.yaml</span></td></tr>'; }).join("") +
    "</tbody></table></div></section>" +

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:var(--sp-4)">' +
    '<section class="panel"><h2 style="font-size:var(--fs-lg);margin:0 0 var(--sp-2)">Warnings and notes by code</h2><div style="display:grid;gap:8px">' +
      R.issues.map(function (w) {
        return '<details style="border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px"><summary style="cursor:pointer;display:flex;gap:8px;align-items:center">' +
          '<span class="tag ' + (w.level === "warning" ? "tag-warn" : "tag-info") + '">' + w.level + '</span><span class="mono" style="font-size:var(--fs-sm)">' + esc(w.code) + '</span><span style="flex:1"></span><strong>' + w.count + "</strong></summary>" +
          '<p style="margin:6px 0 2px;font-size:var(--fs-md)">' + esc(w.message) + '</p><ul class="faint" style="margin:4px 0 0;padding-left:18px;font-size:var(--fs-sm)">' + w.examples.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + (w.count > w.examples.length ? "<li>… and " + (w.count - w.examples.length) + " more</li>" : "") + "</ul></details>";
      }).join("") + "</div></section>" +
    '<section class="panel"><h2 style="font-size:var(--fs-lg);margin:0 0 var(--sp-2)">Frequency results by rule</h2><table class="dt"><thead><tr><th>Rule</th><th>Confidence</th><th style="text-align:right">Jobs</th><th style="width:40%"></th></tr></thead><tbody>' +
      R.rules.map(function (r) {
        var c = r.conf === "parsed" ? "var(--ok)" : r.conf === "assumed" ? "var(--warn)" : "var(--danger)";
        return '<tr><td class="mono">' + esc(r.rule) + '</td><td><span class="tag ' + (r.conf === "parsed" ? "tag-ok" : r.conf === "assumed" ? "tag-warn" : "tag-danger") + '">' + r.conf + '</span></td><td style="text-align:right">' + r.count +
          '</td><td><div style="height:8px;border-radius:4px;background:' + c + ";width:" + Math.max(2, Math.round(r.count / maxRule * 100)) + '%"></div></td></tr>';
      }).join("") + '<tr><td colspan="2"><strong>Total</strong></td><td style="text-align:right"><strong>' + R.rules.reduce(function (n, r) { return n + r.count; }, 0) + '</strong></td><td></td></tr></tbody></table>' +
      '<p class="faint" style="font-size:var(--fs-sm);margin:8px 0 0">"cron (column)" means the DataFusion <em>Schedule interval</em> column was used instead of the text (DESIGN.md §10.2). Disagreements are listed under FREQ_CONFLICT. Assumed schedules show "≈" everywhere and list their assumptions in the job drawer.</p></section>' +
    "</div></div>";

  var drop = document.getElementById("drop");
  ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  document.getElementById("browse").addEventListener("click", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
